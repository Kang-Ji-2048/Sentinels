# Databricks Asset Bundle: deploy with `databricks bundle deploy`, or recreate the job by hand in the UI.
# One job, four chained tasks, every 15 minutes, serverless (the only compute on Free Edition).
bundle:
  name: sentinels

resources:
  jobs:
    sentinels_watch:
      name: sentinels-watch
      schedule:
        quartz_cron_expression: "0 0/15 * * * ?"
        timezone_id: Europe/London
        pause_status: PAUSED   # unpause when you're ready; agents cost API credits each run
      max_concurrent_runs: 1
      tasks:
        - task_key: ingest_bronze
          notebook_task: { notebook_path: ./notebooks/01_ingest_bronze.py }
        - task_key: detect_silver_gold
          depends_on: [{ task_key: ingest_bronze }]
          notebook_task: { notebook_path: ./notebooks/02_detect_silver_gold.py }
        - task_key: agents
          depends_on: [{ task_key: detect_silver_gold }]
          notebook_task:
            notebook_path: ./notebooks/03_agents.py
            base_parameters: { top_n: "3" }
        - task_key: insights
          depends_on: [{ task_key: agents }]
          notebook_task: { notebook_path: ./notebooks/05_insights.py }

targets:
  dev:
    default: true
    mode: development
